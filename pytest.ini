# pytest 配置
#
# pythonpath = . 让 pytest 把仓库根目录加入 sys.path。
# 否则用 `pytest`（console script）调用时，sys.path[0] 是 pytest 的安装目录，
# 而非仓库根 —— tests/ 下 `import compression` / `import middleware`
# 这类根级模块会 ModuleNotFoundError，导致收集阶段直接失败（exit code 2）。
#
# 本地用 `python -m pytest` 时 sys.path[0] 恰好是当前目录，所以掩盖了这个问题。
[pytest]
pythonpath = .
testpaths = tests
