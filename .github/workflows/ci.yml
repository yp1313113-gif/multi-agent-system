name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile $(find . -name "*.py" -not -path "./.git/*")

      - name: Run tests
        env:
          MODEL_TESTS: "0"
        run: |
          set +e
          pytest -q tests/ --tb=short > /tmp/pytest.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "--- pytest failed with exit $CODE ---"
            sed -n '1,60p' /tmp/pytest.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=pytest-output::$line"
            done
          fi
          cat /tmp/pytest.log
          exit $CODE
