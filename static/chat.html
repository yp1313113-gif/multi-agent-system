<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研发费用智能助手</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
  header{background:#0f2d5e;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
  header .logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#1677ff,#722ed1);display:flex;align-items:center;justify-content:center;font-size:18px}
  header h1{font-size:16px}
  header .sub{font-size:11px;opacity:.7}
  #msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
  .m{max-width:72%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .u{align-self:flex-end;background:#1677ff;color:#fff;border-bottom-right-radius:3px}
  .b{align-self:flex-start;background:#fff;border:1px solid #e5e6eb;border-bottom-left-radius:3px}
  .typing::after{content:"▍";animation:blink 1s infinite}
  @keyframes blink{50%{opacity:0}}
  .chips{display:flex;gap:8px;padding:8px 24px;flex-wrap:wrap}
  .qc{background:#e6f4ff;color:#1677ff;border-radius:14px;padding:6px 14px;font-size:12px;cursor:pointer;border:1px solid #91caff}
  .qc:hover{background:#bae0ff}
  footer{display:flex;gap:10px;padding:12px 24px 18px;border-top:1px solid #e5e6eb;background:#fff}
  input{flex:1;border:1px solid #d9d9d9;border-radius:8px;padding:10px 14px;font-size:14px;outline:none}
  input:focus{border-color:#1677ff}
  button{background:#1677ff;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer}
  button:disabled{opacity:.5}
  .src{font-size:11px;color:#86909c;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="logo">🤖</div>
  <div><h1>研发费用智能助手</h1><div class="sub">多 Agent 平台 · 政策问答 / 费用归集 / 风险扫描 / 工时填报 · SSE 流式</div></div>
</header>
<div id="msgs">
  <div class="m b">你好！我是研发费用智能助手 👋<br>可以问我：<br>· "研发费用加计扣除比例是多少？"<br>· "高新技术企业认定条件有哪些？"<br>· "帮我把研发服务器电费归集到直接投入费用"<br>· "扫描研发费用风险：其他相关费用占比 15%"<br>· "帮王建国填报今天在恒泰项目的6小时工时"</div>
</div>
<div class="chips" id="chips"></div>
<footer>
  <input id="inp" placeholder="输入问题，回车发送…" autocomplete="off">
  <button id="btn">发送</button>
</footer>
<script>
var sid = localStorage.getItem('agent_session') || ('s' + Date.now());
localStorage.setItem('agent_session', sid);
var msgs = document.getElementById('msgs');
var inp = document.getElementById('inp');
var btn = document.getElementById('btn');

var quick = ['研发费用加计扣除比例是多少？','高新技术企业认定条件有哪些？','帮我把研发服务器电费归集到直接投入费用','扫描研发费用风险：其他相关费用占比 15%','帮王建国填报今天在恒泰项目的6小时工时'];
var chipsEl = document.getElementById('chips');
chipsEl.innerHTML = quick.map(function(q){ return '<span class="qc">' + q + '</span>'; }).join('');
chipsEl.addEventListener('click', function(e){ if(e.target.classList.contains('qc')){ inp.value = e.target.textContent; send(); } });

function addMsg(cls, text){
  var d = document.createElement('div');
  d.className = 'm ' + cls;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}
async function send(){
  var q = inp.value.trim();
  if(!q) return;
  inp.value = '';
  addMsg('u', q);
  var bot = addMsg('b', '');
  bot.classList.add('typing');
  btn.disabled = true;
  var buf = '';
  try{
    var resp = await fetch('/chat?message=' + encodeURIComponent(q) + '&session=' + encodeURIComponent(sid));
    if(!resp.ok || !resp.body){ bot.textContent = '请求失败: ' + resp.status; return; }
    var reader = resp.body.getReader();
    var dec = new TextDecoder();
    var text = '';
    while(true){
      var r = await reader.read();
      if(r.done) break;
      buf += dec.decode(r.value, {stream:true});
      var idx;
      while((idx = buf.indexOf('\n\n')) >= 0){
        var evt = buf.slice(0, idx); buf = buf.slice(idx+2);
        var m = evt.match(/^data: (.*)$/m);
        if(m){ text += m[1]; bot.textContent = text; msgs.scrollTop = msgs.scrollHeight; }
      }
    }
    if(!text){ bot.textContent = '（没有生成回答）'; }
  }catch(err){
    bot.textContent = '连接失败：' + err.message;
  }
  bot.classList.remove('typing');
  btn.disabled = false;
}
btn.addEventListener('click', send);
inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') send(); });
</script>
</body>
</html>
